openapi: 3.0.3

info:
  title: BookMySlot API
  description: |
    ## Overview
    BookMySlot is a multi-tenant appointment booking backend for Indian local service
    businesses (salons, clinics, coaching centres). A single Express.js server and
    MongoDB Atlas cluster serve every registered business; tenant isolation is enforced
    at the middleware layer via the authenticated user's `businessId` JWT claim.

    ## Authentication
    Protected endpoints require a Bearer JWT in the `Authorization` header:
    ```
    Authorization: Bearer <token>
    ```
    JWTs are issued on login and expire after **7 days**. The payload contains
    `{ userId, role, businessId }`.

    ## Roles
    | Role | Symbol used in this spec |
    |---|---|
    | Business Owner | `OWNER` |
    | Customer | `CUSTOMER` |
    | Super Admin | `ADMIN` |
    | Public (no auth) | `PUBLIC` |

    ## Multi-Tenancy
    Every resource that belongs to a business carries a `businessId` field.
    Middleware automatically injects `req.businessId` from the JWT claim and
    appends it to all Mongoose queries. An owner **cannot** read or mutate
    another tenant's data — the server returns `403 FORBIDDEN` if the resolved
    businessId does not match the resource's businessId.

    ## Standard Response Envelope
    All responses (success and error) use the same outer shape:
    ```json
    { "success": true,  "data": { … } }
    { "success": false, "error": { "code": "…", "message": "…", "statusCode": 400 } }
    ```

    ## Error Codes
    | HTTP | Code | Meaning |
    |---|---|---|
    | 400 | `VALIDATION_ERROR` | Invalid or missing input |
    | 401 | `UNAUTHORIZED` | Missing or expired JWT |
    | 403 | `FORBIDDEN` | Role or tenant mismatch |
    | 404 | `NOT_FOUND` | Resource not found |
    | 409 | `SLOT_UNAVAILABLE` | Slot taken by concurrent booking |
    | 429 | `RATE_LIMITED` | Too many requests |
    | 500 | `INTERNAL_ERROR` | Unexpected server error |

  version: 1.0.0
  contact:
    name: BookMySlot Team

servers:
  - url: https://bookmyslot-api.onrender.com/api
    description: Production (Render)
  - url: http://localhost:5000/api
    description: Local development

tags:
  - name: Auth
    description: Registration, login, logout, and session endpoints
  - name: Business
    description: Business profile management and configuration
  - name: Services
    description: Bookable services offered by a business
  - name: Staff
    description: Staff members who deliver services
  - name: TimeSlots
    description: Slot generation, availability queries, and blocking
  - name: Bookings
    description: Appointment creation, viewing, and status updates
  - name: Analytics
    description: Revenue, booking metrics, and peak-hours data
  - name: Admin
    description: Super Admin cross-tenant management console

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ══════════════════════════════════════════
  # AUTH
  # ══════════════════════════════════════════

  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new business owner
      description: |
        Creates a **Business Owner** user account and an associated Business document
        in a single atomic MongoDB transaction. Returns a signed JWT on success.
        A welcome email is sent asynchronously; email failure does not block the response.

        **Auth:** `PUBLIC`
        **Tenant note:** Creates a new tenant (Business document) on success.
        **Rate limit:** 10 requests / 15 min per IP.
      operationId: registerOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOwnerRequest'
            example:
              name: "Priya Sharma"
              email: "priya@sunshinesalon.in"
              password: "Secure@123"
              phone: "9876543210"
              businessName: "Sunshine Salon"
              category: "salon"
              city: "Pune"
              description: "Premium unisex salon in Koregaon Park"
      responses:
        '201':
          description: Owner and business created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    id: "64a1f2c3e4b5d6f7a8b9c0d1"
                    name: "Priya Sharma"
                    email: "priya@sunshinesalon.in"
                    role: "business_owner"
                    businessId: "64a1f2c3e4b5d6f7a8b9c0d2"
                    phone: "9876543210"
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: "EMAIL_TAKEN"
                  message: "An account with this email already exists."
                  statusCode: 409
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/register/customer:
    post:
      tags: [Auth]
      summary: Register a new customer account
      description: |
        Creates a **Customer** user account. Kept separate from owner registration
        to avoid role ambiguity. No business document is created.

        **Auth:** `PUBLIC`
        **Tenant note:** Customers are not scoped to a tenant at registration.
        **Rate limit:** 10 requests / 15 min per IP.
      operationId: registerCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
            example:
              name: "Rohan Kulkarni"
              email: "rohan@example.com"
              password: "MyPass@456"
              phone: "9988776655"
      responses:
        '201':
          description: Customer account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    id: "64a9b8c7d6e5f4a3b2c1d0e9"
                    name: "Rohan Kulkarni"
                    email: "rohan@example.com"
                    role: "customer"
                    businessId: null
                    phone: "9988776655"
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login (all roles)
      description: |
        Accepts email and password for any role (Business Owner, Customer, Super Admin).
        Returns a signed JWT containing `{ userId, role, businessId }`.

        **Auth:** `PUBLIC`
        **Rate limit:** 10 requests / 15 min per IP.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "priya@sunshinesalon.in"
              password: "Secure@123"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                  user:
                    id: "64a1f2c3e4b5d6f7a8b9c0d1"
                    name: "Priya Sharma"
                    email: "priya@sunshinesalon.in"
                    role: "business_owner"
                    businessId: "64a1f2c3e4b5d6f7a8b9c0d2"
                    phone: "9876543210"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: "UNAUTHORIZED"
                  message: "Invalid email or password."
                  statusCode: 401
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      description: |
        Invalidates the current session. Because JWTs are stateless, the primary
        action on the server side is to clear any server-side token blocklist entry
        (if implemented) and signal the frontend to delete the stored token.
        The client must delete the token from localStorage on receipt of this response.

        **Auth:** `OWNER | CUSTOMER | ADMIN`
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
              example:
                success: true
                data:
                  message: "Logged out successfully."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      description: |
        Decodes the JWT and returns the current user's profile. Used by the
        frontend to restore session state on page refresh without storing user
        data in localStorage beyond the token itself.

        **Auth:** `OWNER | CUSTOMER | ADMIN`
        **Tenant note:** Returns only the caller's own data.
      operationId: getMe
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserProfile'
              example:
                success: true
                data:
                  id: "64a1f2c3e4b5d6f7a8b9c0d1"
                  name: "Priya Sharma"
                  email: "priya@sunshinesalon.in"
                  role: "business_owner"
                  businessId: "64a1f2c3e4b5d6f7a8b9c0d2"
                  phone: "9876543210"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ══════════════════════════════════════════
  # BUSINESS
  # ══════════════════════════════════════════

  /businesses:
    get:
      tags: [Admin]
      summary: List all businesses (Super Admin)
      description: |
        Returns a paginated list of all registered businesses across all tenants.
        Includes booking count aggregated per business.
        Supports filtering by `isActive` status.

        **Auth:** `ADMIN`
        **Tenant note:** No tenant scoping — Super Admin sees all tenants.
      operationId: listAllBusinesses
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: isActive
          in: query
          required: false
          description: Filter by active/suspended status
          schema:
            type: boolean
      responses:
        '200':
          description: Paginated list of all businesses
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          businesses:
                            type: array
                            items:
                              $ref: '#/components/schemas/BusinessAdminView'
                          pagination:
                            $ref: '#/components/schemas/Pagination'
              example:
                success: true
                data:
                  businesses:
                    - id: "64a1f2c3e4b5d6f7a8b9c0d2"
                      name: "Sunshine Salon"
                      slug: "sunshine-salon"
                      category: "salon"
                      city: "Pune"
                      isActive: true
                      bookingCount: 142
                      createdAt: "2026-01-10T06:00:00.000Z"
                  pagination:
                    total: 34
                    page: 1
                    limit: 20
                    pages: 2
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Business]
      summary: Create a business
      description: |
        Creates a Business document and links it to the authenticated owner.
        In normal flow this is called internally by `POST /auth/register`. Exposed
        here for direct use (e.g., Super Admin creating a business on behalf of an owner).

        **Auth:** `OWNER | ADMIN`
        **Tenant note:** Creates a new tenant. The authenticated owner becomes the business owner.
      operationId: createBusiness
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBusinessRequest'
            example:
              name: "Sunshine Salon"
              category: "salon"
              city: "Pune"
              phone: "9876543210"
              description: "Premium unisex salon"
              workingHours:
                - day: "monday"
                  start: "09:00"
                  end: "19:00"
                - day: "tuesday"
                  start: "09:00"
                  end: "19:00"
              bufferMinutes: 10
      responses:
        '201':
          description: Business created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /businesses/{slug}:
    get:
      tags: [Business]
      summary: Get public business profile by slug
      description: |
        Returns the public-facing business profile. Called when a customer visits
        `/b/:slug` on the frontend to load business info and begin the booking flow.
        Returns `404` if the business does not exist, and `403` if `isActive` is false
        (suspended businesses are invisible to the public).

        **Auth:** `PUBLIC`
        **Tenant note:** Slug uniquely identifies one tenant. No cross-tenant risk.
      operationId: getBusinessBySlug
      parameters:
        - $ref: '#/components/parameters/slug'
      responses:
        '200':
          description: Business profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BusinessPublic'
              example:
                success: true
                data:
                  id: "64a1f2c3e4b5d6f7a8b9c0d2"
                  name: "Sunshine Salon"
                  slug: "sunshine-salon"
                  category: "salon"
                  city: "Pune"
                  phone: "9876543210"
                  description: "Premium unisex salon in Koregaon Park"
                  workingHours:
                    - day: "monday"
                      start: "09:00"
                      end: "19:00"
                  bufferMinutes: 10
                  isActive: true
        '403':
          description: Business is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: "FORBIDDEN"
                  message: "This business is currently unavailable."
                  statusCode: 403
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /businesses/{id}:
    put:
      tags: [Business]
      summary: Update own business profile (Owner)
      description: |
        Allows a Business Owner to update their business profile fields.
        The server validates `req.user.businessId === req.params.id`; a mismatch
        returns `403`. If `name` changes, a new slug is generated and checked for
        global uniqueness.

        **Auth:** `OWNER`
        **Tenant note:** Strictly scoped — owner can only update their own business.
      operationId: updateBusiness
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBusinessRequest'
            example:
              name: "Sunshine Salon & Spa"
              phone: "9123456789"
              description: "Full-service unisex salon and spa"
              bufferMinutes: 15
      responses:
        '200':
          description: Business updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /businesses/{id}/suspend:
    patch:
      tags: [Admin]
      summary: Suspend or reactivate a business (Super Admin)
      description: |
        Toggles `isActive` on a Business document to `true` or `false`.
        When `isActive` is set to `false`, the business's public booking page
        immediately returns a 403 to all visitors.
        Every toggle is written to the `AuditLog` collection with the admin's
        userId, timestamp, and the previous/new state.

        **Auth:** `ADMIN`
        **Tenant note:** No tenant scope — Admin can target any business.
      operationId: suspendBusiness
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendBusinessRequest'
            examples:
              suspend:
                summary: Suspend a business
                value:
                  isActive: false
                  reason: "Fraudulent bookings reported"
              reactivate:
                summary: Reactivate a business
                value:
                  isActive: true
                  reason: "Issue resolved by owner"
      responses:
        '200':
          description: Business suspension state updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          isActive:
                            type: boolean
                          auditLogId:
                            type: string
              example:
                success: true
                data:
                  id: "64a1f2c3e4b5d6f7a8b9c0d2"
                  name: "Sunshine Salon"
                  isActive: false
                  auditLogId: "64f9e8d7c6b5a4938271605e"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /businesses/{id}/block-days:
    post:
      tags: [Business]
      summary: Block full days off (holidays, closures)
      description: |
        Creates `TimeSlot` documents with `status: blocked` spanning the entire
        working day for all staff on the given dates. Useful for public holidays,
        sudden closures, or owner leave. All computed slots for those dates become
        unavailable to customers.

        **Auth:** `OWNER`
        **Tenant note:** `id` must match `req.user.businessId`; enforced by tenant guard.
      operationId: blockDays
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockDaysRequest'
            example:
              dates:
                - "2026-08-15"
                - "2026-08-16"
              reason: "Independence Day long weekend"
      responses:
        '200':
          description: Days blocked successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          blockedDates:
                            type: array
                            items:
                              type: string
                              format: date
                          slotsCreated:
                            type: integer
                            description: Number of TimeSlot documents created
              example:
                success: true
                data:
                  blockedDates: ["2026-08-15", "2026-08-16"]
                  slotsCreated: 2
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /businesses/{id}/working-hours:
    put:
      tags: [Business]
      summary: Set business working hours
      description: |
        Replaces the entire `workingHours` array on the Business document.
        Omitting a day of the week implies the business is closed that day.
        `start` and `end` must be in `HH:MM` 24-hour format; `end` must be after `start`.

        **Auth:** `OWNER`
        **Tenant note:** `id` must match `req.user.businessId`.
      operationId: setWorkingHours
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetWorkingHoursRequest'
            example:
              workingHours:
                - day: "monday"
                  start: "09:00"
                  end: "19:00"
                - day: "tuesday"
                  start: "09:00"
                  end: "19:00"
                - day: "wednesday"
                  start: "09:00"
                  end: "19:00"
                - day: "thursday"
                  start: "09:00"
                  end: "19:00"
                - day: "friday"
                  start: "09:00"
                  end: "20:00"
                - day: "saturday"
                  start: "10:00"
                  end: "18:00"
      responses:
        '200':
          description: Working hours updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Business'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  # ══════════════════════════════════════════
  # SERVICES
  # ══════════════════════════════════════════

  /businesses/{businessId}/services:
    get:
      tags: [Services]
      summary: List active services for a business
      description: |
        Returns all services where `isActive: true` for the given business.
        Used on the public booking page to populate service selection.

        **Auth:** `PUBLIC`
        **Tenant note:** `businessId` path param scopes the query — no cross-tenant leakage.
      operationId: listServices
      parameters:
        - $ref: '#/components/parameters/businessId'
      responses:
        '200':
          description: List of active services
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Service'
              example:
                success: true
                data:
                  - id: "64b2a3d4e5f6g7h8i9j0k1l2"
                    businessId: "64a1f2c3e4b5d6f7a8b9c0d2"
                    name: "Haircut & Styling"
                    description: "Precision cut with blowdry finish"
                    durationMinutes: 45
                    priceINR: 500
                    isActive: true
                    createdAt: "2026-01-15T10:30:00.000Z"
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Services]
      summary: Create a new service
      description: |
        Creates a service scoped to the authenticated owner's business.
        `durationMinutes` must be a **positive multiple of 15**. `priceINR` must
        be ≥ 0 (free consultations are allowed). Service names are unique
        (case-insensitive) within a business.

        **Auth:** `OWNER`
        **Tenant note:** Service is automatically scoped to `req.businessId` from JWT;
        the `businessId` path param is verified against the JWT claim.
      operationId: createService
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/businessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
            example:
              name: "Hair Colour (Global)"
